<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FlowForge</title>



    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >
 <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <div class="app">


        <!-- ==================================
             SIDEBAR
        =================================== -->

        <aside class="sidebar">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">

                    <img
                        src="assets/logo.svg"
                        alt="FlowForge logo"
                        draggable="false"
                    >

                </div>

                <span>FlowForge</span>

            </div>


            <!-- DIVIDER -->

            <div class="divider"></div>


            <!-- NODES HEADING -->

            <div class="nodes-heading">

                <span>Nodes</span>

                <span class="add-icon">
                    +
                </span>

            </div>


            <!-- NODE LIBRARY -->

            <div class="node-library">


                <!-- TRIGGER -->

                <div
                    class="library-item"
                    data-type="trigger"
                >

                    <div class="library-icon">

                        <img
                            src="assets/Trigger.svg"
                            alt="Trigger"
                            draggable="false"
                        >

                    </div>

                    <span>Trigger</span>

                </div>


                <!-- API -->

                <div
                    class="library-item"
                    data-type="api"
                >

                    <div class="library-icon">

                        <img
                            src="assets/API.svg"
                            alt="API"
                            draggable="false"
                        >

                    </div>

                    <span>API</span>

                </div>


                <!-- CONDITIONS -->

                <div
                    class="library-item"
                    data-type="condition"
                >

                    <div class="library-icon">

                        <img
                            src="assets/Conditions.svg"
                            alt="Conditions"
                            draggable="false"
                        >

                    </div>

                    <span>Conditions</span>

                </div>


                <!-- TRANSFORM -->

                <div
                    class="library-item"
                    data-type="transform"
                >

                    <div class="library-icon">

                        <img
                            src="assets/Transform.svg"
                            alt="Transform"
                            draggable="false"
                        >

                    </div>

                    <span>Transform</span>

                </div>


                <!-- OUTPUT -->

                <div
                    class="library-item"
                    data-type="output"
                >

                    <div class="library-icon">

                        <img
                            src="assets/Output.svg"
                            alt="Output"
                            draggable="false"
                        >

                    </div>

                    <span>Output</span>

                </div>

            </div>

        </aside>


        <!-- ==================================
             CANVAS
        =================================== -->

        <main class="canvas">


            <!-- SVG CONNECTION LAYER -->

            <svg
                class="connections"
            ></svg>


            <!-- DELETE CONNECTION BUTTON -->

            <button
                class="delete-connection-btn"
                id="deleteConnectionBtn"
            >
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 16 16"
                    fill="none"
                >
                    <path
                        d="M2 4h12M5.333 4V2.667a1.333 1.333 0 0 1 1.334-1.334h2.666a1.333 1.333 0 0 1 1.334 1.334V4m2 0v9.333a1.333 1.333 0 0 1-1.334 1.334H4.667a1.333 1.333 0 0 1-1.334-1.334V4h9.334Z"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </button>


            <!-- DELETE NODE ICON -->

            <div
                class="delete-node-icon"
                id="deleteNodeIcon"
            >
                <svg
                    width="14"
                    height="14"
                    viewBox="0 0 16 16"
                    fill="none"
                >
                    <path
                        d="M2 4h12M5.333 4V2.667a1.333 1.333 0 0 1 1.334-1.334h2.666a1.333 1.333 0 0 1 1.334 1.334V4m2 0v9.333a1.333 1.333 0 0 1-1.334 1.334H4.667a1.333 1.333 0 0 1-1.334-1.334V4h9.334Z"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </div>


        </main>


    </div>


    <!-- JAVASCRIPT -->

    <script
        src="js/main.js"
    ></script>

</body>

</html>
