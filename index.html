<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlowForge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <!-- BRAND -->
            <div class="brand">

                <div class="brand-icon">
                    <img src="assets/logo.svg" alt="FlowForge logo">
                </div>

                <span>FlowForge</span>

            </div>


            <!-- DIVIDER -->
            <div class="divider"></div>


            <!-- NODES HEADING -->
            <div class="nodes-heading">

                <span>Nodes</span>

                <span class="add-icon">+</span>

            </div>


            <!-- NODE LIBRARY -->
            <div class="node-library">

                <!-- TRIGGER -->
                <div class="library-item" data-type="trigger">

                    <div class="library-icon">
                        <img src="assets/Trigger.svg" alt="Trigger">
                    </div>

                    <span>Trigger</span>

                </div>


                <!-- API -->
                <div class="library-item" data-type="api">

                    <div class="library-icon">
                        <img src="assets/API.svg" alt="API">
                    </div>

                    <span>API</span>

                </div>


                <!-- CONDITION -->
                <div class="library-item" data-type="condition">

                    <div class="library-icon">
                        <img src="assets/Conditions.svg" alt="Conditions">
                    </div>

                    <span>Conditions</span>

                </div>


                <!-- TRANSFORM -->
                <div class="library-item" data-type="transform">

                    <div class="library-icon">
                        <img src="assets/Transform.svg" alt="Transform">
                    </div>

                    <span>Transform</span>

                </div>


                <!-- OUTPUT -->
                <div class="library-item" data-type="output">

                    <div class="library-icon">
                        <img src="assets/Output.svg" alt="Output">
                    </div>

                    <span>Output</span>

                </div>

            </div>

        </aside>


        <!-- CANVAS -->
        <main class="canvas"></main>

    </div>


    <script src="js/main.js"></script>

</body>

</html>
