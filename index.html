<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <!-- Brand -->
            <div class="brand">
                <div class="brand-icon">
                    <image src="assets/logo.svg"></image>
                </div>

                <span>FlowForge</span>
            </div>

            <div class="divider"></div>

            <!-- Nodes heading -->
            <div class="nodes-heading">
                <span>Nodes</span>
                <span class="add-icon">+</span>
            </div>

            <!-- Node library -->
            <div class="node-library">

                <div class="library-item">
                    <div class="library-icon trigger-icon">
                    <image src = "assets/Trigger.svg"></image>
                    </div>
                    <span>Trigger</span>
                </div>

                <div class="library-item">
                    <div class="library-icon trigger-icon">
                    <image src = "assets/API.svg"></image>
                    </div>
                    
                    <span>API</span>
                </div>

                <div class="library-item">
                    <div class="library-icon trigger-icon">
                    <image src = "assets/Conditions.svg"></image>
                    </div>
                    <span>Conditions</span>
                </div>

                <div class="library-item">
                    <div class="library-icon trigger-icon">
                    <image src = "assets/Transform.svg"></image>
                    </div>
                    
                    <span>Transform</span>
                </div>

                <div class="library-item">
                    <div class="library-icon trigger-icon">
                    <image src = "assets/Output.svg"></image>
                    </div>
                    
                    <span>Output</span>
                </div>

            </div>

        </aside>


        <!-- Canvas -->
        <main class="canvas">

    <!-- Trigger Node -->
    <div class="node trigger-node">
        <div class="node-card">
            <img src="assets/Trigger.svg" alt="Trigger">
            <span class="handle output-handle"></span>
        </div>

        <span class="node-label">Trigger</span>
    </div>


    <!-- API Node -->
    <div class="node api-node">
        <div class="node-card">
            <span class="handle input-handle"></span>

            <img src="assets/API.svg" alt="API">

            <span class="handle output-handle"></span>
        </div>

        <span class="node-label">API</span>
    </div>


    <!-- Conditions Node -->
    <div class="node condition-node">
        <div class="node-card">
            <span class="handle input-handle"></span>

            <img src="assets/Conditions.svg" alt="Conditions">

            <span class="handle output-handle"></span>
        </div>

        <span class="node-label">Conditions</span>
    </div>


    <!-- Transform Node -->
    <div class="node transform-node">
        <div class="node-card">
            <span class="handle input-handle"></span>

            <img src="assets/Transform.svg" alt="Transform">

            <span class="handle output-handle"></span>
        </div>

        <span class="node-label">Transform</span>
    </div>


    <!-- Output Node -->
    <div class="node output-node">
        <div class="node-card">
            <span class="handle input-handle"></span>

            <img src="assets/Output.svg" alt="Output">
        </div>

        <span class="node-label">Output</span>
    </div>

</main>

    </div>


<script src="js/main.js"></script>
</body>
</html>
